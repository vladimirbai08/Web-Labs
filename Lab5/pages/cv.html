<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анкета для працевлаштування</title>
</head>
<body>
    <main>
        <h2>Анкета для працевлаштування (CV)</h2>
        <form action="/submit-cv" method="POST">
            
            <fieldset>
                <legend>Особиста інформація</legend>
                <div>
                    <label for="fullname">ПІБ:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>
                <div>
                    <label for="useremail">Електронна пошта:</label>
                    <input type="email" id="useremail" name="email" required>
                </div>
                <div>
                    <label for="userphone">Телефон:</label>
                    <input type="tel" id="userphone" name="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{2}-[0-9]{2}">
                    <small>Формат: 0ХХ-ХХХ-ХХ-ХХ</small>
                </div>
            </fieldset>

            <fieldset>
                <legend>Професійна інформація</legend>
                <div>
                    <label for="jobposition">Посада, на яку претендуєте:</label>
                    <select id="jobposition" name="position" required>
                        <option value="">Оберіть посаду:</option>
                        <option value="chef">Керівник відділу</option>
                        <option value="manager">Менеджер</option>
                        <option value="seller">Продавець</option>
                    </select>
                </div>
                <div>
                    <label for="experience">Досвід роботи (в роках):</label>
                    <input type="number" id="experience" name="experience_years" min="0" max="40" step="1" value="0">
                </div>
                <div>
                    <label for="portfoliourl">Посилання на портфоліо або GitHub:</label>
                    <input type="url" id="portfoliourl" name="portfolio" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Документи та коментарі</legend>
                <div>
                    <label for="resumefile">Завантажити резюме (тільки .pdf або .doc):</label>
                    <input type="file" id="resumefile" name="resume" accept=".pdf,.doc,.docx" required>
                </div>
                <div>
                    <label for="addinfo">Додаткова інформація:</label><br>
                    <textarea id="addinfo" name="addinfotext" rows="5" cols="60"></textarea>
                </div>
            </fieldset>

            <div>
                <button type="submit">Надіслати анкету</button>
                <button type="reset">Очистити форму</button>
            </div>
        </form>
    </main>
<br>
<a href="../index.html">На головну</a>

  </footer>
</body>
</html>
