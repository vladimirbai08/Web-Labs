<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Головна сторінка</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="../style.css">
  </head>
  <body>
    <main>
    <div class="form-container">
      <h2>Реєстрація</h2>
      <form action="#" method="POST">
        <div class="form-group">
          <label for="username">Ім'я користувача</label>
          <input type="text" id="username" name="username" required>
        </div>
        
        <div class="form-group">
          <label for="useremail">Email:</label>
          <input type="text" id="useremail" name="email" required>
        </div>

        <div class="form-group">
          <label for="userpassword">Пароль:</label>
          <input type="password" id="userpassword" name="password" required>
        </div>
        <button type="submit" class="submit-btn">Зареєструватися</button>
      </form>
      <p class="form-footer">Вже є акаунт? <a href="login.html">Увійти</a></p>
    </div>
    <br>
    <a href="../index.html" class="back-link">На головну</a>
    </main>
    <footer>
      <p>&copy; 2026 НТУ «ХПІ», Володимир Бай</p>
    </footer>
  </body>
</html>
