<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід у систему</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="../style.css">
</head>
  <body>
    <main>
    <div class="form-container">
      <h2>Вхід</h2>
      <form action="/login" method="POST">
        <div class="form-group">
          <label for="useremail">Email:</label>
          <input type="text" id="useremail" name="email" required>
        </div>

        <div class="form-group">
          <label for="userpassword">Пароль:</label>
          <input type="password" id="userpassword" name="password" required>
        </div>
        <button type="submit" class="submit-btn">Увійти</button>
      </form>
      <p class="form-footer">Немає акаунту? <a href="registration.html">Зареєструватися</a></p>
    </div>
    <br>
    <a href="profile.html" class="back-link">Редагувати профіль</a>
    <br>
    <a href="../index.html" class="back-link">На головну</a>
    </main>
    <footer>
    <p>&copy; 2026 НТУ «ХПІ», Володимир Бай</p>
    </footer>
  </body>
</html>
